[project]
name = "socmint"
version = "0.1.0"
description = "SOCMINT-India v0: tipline, scam/impersonation detection, market-manipulation risk and narrative mapping from free, lawful sources."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - prototype" }
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "feedparser>=6.0",
    "tldextract>=5.1",
    "langdetect>=1.0.9",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "datasketch>=1.6",
    "networkx>=3.2",
    "imagehash>=4.3",
    "pillow>=10.0",
    "pytesseract>=0.3.10",
    "dnstwist>=20240812",
    "dnspython>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "streamlit>=1.35",
    "python-telegram-bot>=21.0",
    "telethon>=1.36",
    "websockets>=12.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "sentence-transformers>=3.0",
    "faster-whisper>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
socmint = "socmint.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["socmint"]

# CPU-only torch wheels (no CUDA download).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

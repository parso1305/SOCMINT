# Brands monitored for impersonation.
#
# official_domains: registrable domains the brand actually uses. Each was verified on 2026-10-03 by DNS
#   resolution + HTTPS (redirect targets noted). Banks moved to RBI's `.bank.in` space in 2025.
# support_numbers: ONLY numbers seen on the brand's own official page (URL in `verified_from`).
#   Empty list = could not verify (page is JS-rendered); add numbers by hand after checking the site.
# aliases: spellings per language incl. Devanagari (hi/mr) and Hinglish.
# lookalike_keywords: >=5-char strings for "domain contains brand keyword" checks (short ones like
#   "sbi" would match far too many unrelated domains).
# dnstwist: run dnstwist permutations + DNS resolution for `dnstwist_domains`.

extra_suffixes: [bank.in, fin.in]   # RBI-run suffixes missing from tldextract's bundled list

brands:
  - key: demobank
    name: DemoBank (fictional)
    synthetic: true
    official_domains: [demobank.example]
    official_handles: ["@DemoBankOfficial"]
    support_numbers: ["1800 000 0000"]
    aliases:
      en: [demobank, demo bank]
      hi: [डेमोबैंक, डेमो बैंक]
      mr: [डेमोबँक, डेमो बँक]
    lookalike_keywords: [demobank]
    dnstwist: false   # fictional .example domain: lookalikes come from fixtures

  - key: sbi
    name: State Bank of India
    official_domains: [sbi.co.in, sbi.bank.in, onlinesbi.sbi, sbi]
    support_numbers: ["1800 11 2211", "1800 425 3800", "1800 11 1109"]
    verified_from: https://sbi.bank.in/web/customer-care/contact-us
    aliases:
      en: [sbi, state bank of india, state bank, yono sbi, yono]
      hi: [एसबीआई, स्टेट बैंक, भारतीय स्टेट बैंक]
      mr: [एसबीआय, स्टेट बँक]
    lookalike_keywords: [onlinesbi, yonosbi, sbiyono, sbionline, sbi-kyc]
    dnstwist: true
    dnstwist_domains: [sbi.co.in, onlinesbi.sbi]


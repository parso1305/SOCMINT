# All tunable thresholds and weights. No analysis module hard-codes these values.

scam:
  likely: 70        # score >= likely  -> "likely scam"
  suspicious: 40    # score >= suspicious -> "suspicious"
  max_score: 100

claim_match:
  top_k: 3
  # e5 cosines are compressed (unrelated pairs reach ~0.88), so we subtract the mean embedding of a
  # background corpus (recent items + fact-checks) before cosine. Calibrated on fixtures - see DECISIONS.md.
  e5_centered: 0.52     # centered-cosine threshold (used when >= center_min_background texts exist)
  e5: 0.90              # raw-cosine fallback threshold (prompt suggested 0.80; too loose on fixtures)
  center_min_background: 30
  background_mean_file: data/e5_background_mean.npy   # shipped; recompute: socmint analyze --module background
  background_items: 1000
  tfidf: 0.45           # cosine threshold for the TF-IDF char n-gram fallback

media:
  phash_max_distance: 8
  video_keyframe_every_s: 5
  video_max_frames: 30

narratives:
  window_days: 14
  min_cluster_size: 5
  min_samples: 2
  growth_alert: 2.0          # last-24h count / previous-72h daily average
  min_count_24h: 4
  growth_floor_per_day: 0.5   # denominator floor so brand-new clusters do not divide by zero
  min_baseline_hours: 72       # investigations: no growth alerts until they have collected this long
  factcheck_link_min_shared_keywords: 2   # TF-IDF mode only; links also need >=20% member votes
  keywords_per_cluster: 8

coordination:
  jaccard: 0.8
  num_perm: 128
  shingle_words: 3
  sync_window_minutes: 10
  min_group_size: 3
  min_accounts: 3
  alert_score: 0.6
  weights:            # weighted combination -> score in [0,1]
    accounts: 0.35    # distinct accounts (saturates at accounts_saturation)
    synchrony: 0.35   # share of posts within sync window of the group median
    channels: 0.15    # channel diversity
    burst: 0.15       # 1 - time_span / burst_reference
  accounts_saturation: 10
  burst_reference_minutes: 360

impersonation:
  dnstwist_threads: 8
  max_permutations_per_domain: 400   # homoglyph variants are sampled last
  dnstwist_fuzzers: [addition, bitsquatting, homoglyph, hyphenation, insertion, omission, repetition, replacement, subdomain, transposition, vowel-swap, dictionary, tld-swap]

market:
  baseline_days: 30
  min_baseline_days: 10
  mention_z: 3.0
  volume_z: 3.0
  min_mentions: 5
  min_std_mentions: 1.0      # std floor so a quiet baseline (all zeros) does not explode z
  min_std_log_volume: 0.05
  weights:
    base: 50
    small_cap: 15
    promo_language: 15
    sebi_claim_unverified: 15
    price_jump: 5
  price_jump_pct: 10
  small_cap_turnover_inr: 50000000   # avg daily turnover below this = illiquid proxy (5 crore)

gdelt:
  cooldown_minutes: 15       # after an HTTP 429, GDELT is skipped (status `throttled`, no request) for this long

ingest:
  default_rate_limit_s: 2.0
  http_timeout_s: 20
  http_retries: 3
  cache_ttl_s: 3600
  max_summary_chars: 400

hate:
  enabled: false   # interface only in v0; analyst-only, never shown to citizens

categorize:            # post categories (config/categories.yaml)
  keyword_base: 0.55       # confidence of a keyword label with one hit
  keyword_step: 0.10       # + per extra keyword hit
  keyword_cap: 0.85
  scam_likely: 0.90        # scam label confidence by scam-score band (scam.likely / scam.suspicious)
  scam_suspicious: 0.65
  factcheck_match: 0.90    # misinformation/factcheck_matched when claim matching finds a fact-check
  impersonation: 0.85      # brand_impersonation from non-official contact details / lookalike domain
  market_promo: 0.75       # market_manipulation: ticker + investment-promotion language
  min_confidence: 0.5      # labels below this are not stored
  zero_shot: false         # needs the [ml] extra; degrades gracefully (reported in `degraded`) when unavailable
  zero_shot_model: MoritzLaurer/multilingual-MiniLMv2-L6-mnli-xnli   # ~107M params, ~430 MB, CPU-friendly
  zero_shot_min_score: 0.80
  zero_shot_hypothesis: "This text is about {}."

investigate:
  default_window_days: 7     # first collection of an event with no window start
  subject_window_days: 30    # first collection of a subject or group (recent public posts)
  per_source_limit: 200      # max posts per source per collection
  top_authors: 25            # authors linked as `top_author` per investigation
  max_parallel_sources: 4    # sources fetched at the same time (stores stay sequential; per-host rate limits hold)

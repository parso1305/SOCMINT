  lookalike_domain:
    label: "Domain looks like an official brand domain but is not"
    weight: 35
  brand_unofficial_contact:
    label: "Claims to be a brand but uses a non-official link or number"
    weight: 30
  shortener:
    label: "Uses a link shortener that hides the destination"
    weight: 10
  new_domain:
    label: "Domain not seen before in our sources"
    weight: 5
  apk_link:
    label: "Asks you to install an app file (.apk) from outside the app store"
    weight: 25
  urgency:
    label: "Pressure / urgency language"
    weight: 10
    keywords:
      en: [urgent, immediately, within 24 hours, within 2 hours, today itself, tonight, last chance, final notice,
           act now, hurry, limited time, expires today, or else, otherwise your]
      hi: [तुरंत, तत्काल, अभी, आज ही, आज रात, 24 घंटे, अंतिम चेतावनी, आखिरी मौका, वरना, नहीं तो, जल्दी]
      mr: [तातडीने, लगेच, आजच, आज रात्री, 24 तासांत, अंतिम सूचना, शेवटची संधी, अन्यथा, नाहीतर, लवकर]
      hinglish: [turant, abhi, aaj hi, jaldi, warna, nahi to]
  upi_payment_request:
    label: "Asks for payment to a UPI ID"
    weight: 20
    keywords:   # payment words that must co-occur with a UPI ID
      en: [pay, send, transfer, deposit, fee, charges, payment, registration fee, refundable]
      hi: [भुगतान, भेजें, ट्रांसफर, जमा, फीस, शुल्क, पेमेंट]
      mr: [भरणा, पाठवा, ट्रान्सफर, जमा, फी, शुल्क, पेमेंट]
      hinglish: [bhejo, pay karo, jama karo, fees, transfer karo]
  safe_browsing_hit:
    label: "Google Safe Browsing lists this URL as unsafe"
    weight: 50
  link_request:
    label: "Scam-pattern message asking you to open a link"
    weight: 10          # fires only together with a scam category and a non-official link
  contact_mobile:
    label: "Asks you to call or message a personal mobile number"
    weight: 15          # fires only together with a scam category
    keywords:
      en: [call, contact, whatsapp, message, sms, dial, reach]
      hi: [कॉल, संपर्क, फोन, फ़ोन, व्हाट्सएप, मैसेज]
      mr: [कॉल, संपर्क, फोन, व्हॉट्सॲप, मेसेज]
      hinglish: [call karo, call kare, contact karo, phone karo]
  group_invite:
    label: "Pushes you to join a private Telegram/WhatsApp 'tips' group"
    weight: 15
    hosts: [t.me, telegram.me, chat.whatsapp.com, wa.me]
    keywords:
      en: [vip group, premium group, join group, join channel, telegram group, whatsapp group]
      hi: [वीआईपी ग्रुप, ग्रुप जॉइन, ग्रुप जॉईन]
      mr: [ग्रुप जॉईन, ग्रुप जॉइन]
      hinglish: [group join karo]
  sebi_claim_unverified:
    label: "Claims SEBI registration that is not in our registry list"
    weight: 20
    claim_keywords: [sebi registered, sebi reg, sebi regd, sebi approved, सेबी रजिस्टर्ड, सेबी नोंदणीकृत, सेबी पंजीकृत]

# Link shorteners (signal: shortener). Shortened links are never expanded automatically in v0.
shorteners: [bit.ly, tinyurl.com, is.gd, cutt.ly, rb.gy, shorturl.at, t.ly, tiny.cc, ow.ly, goo.gl, rebrand.ly,
  bitly.com, shorte.st, v.gd, s.id, t.co, short.link, bl.ink, 1url.in, urlzs.com, tiny.example]

# Domains always treated as known (never "new domain").
known_domains: [t.me, telegram.me, chat.whatsapp.com, wa.me, google.com, youtube.com, youtu.be, wikipedia.org, gov.in, nic.in, whatsapp.com, telegram.org,
  facebook.com, instagram.com, x.com, twitter.com, linkedin.com, amazon.in, flipkart.com, rbi.org.in, sebi.gov.in,
  cybercrime.gov.in, npci.org.in, uidai.gov.in]

# TLDs accepted for scheme-less domains in text ("visit sbi-kyc.in"). Fixtures use .example.
bare_domain_tlds: [in, com, net, org, info, xyz, top, site, online, shop, live, app, click, link, club, vip, icu, cc,
  me, io, ly, gl, gd, co, biz, buzz, cyou, store, tech, website, space, fun, pro, sbi, example, test, ru, cn, tk, ml,
  ga, cf, gq, pw, ws, su, rest, bond, sbs, cfd, lol, help, support, today, life, world, news, gov, edu]

# Hosting / shortener domains: a reported URL on these must not taint the whole domain.
shared_hosts: [github.io, githubusercontent.com, blogspot.com, google.com, sites.google.com, forms.gle,
  firebaseapp.com, web.app, pages.dev, workers.dev, vercel.app, netlify.app, herokuapp.com, wixsite.com,
  weebly.com, 000webhostapp.com, glitch.me, ngrok.io, ngrok-free.app, azurewebsites.net, cloudfront.net,
  amazonaws.com, appspot.com, wordpress.com, square.site, webflow.io, framer.app, ipfs.io, dweb.link,
  notion.site, telegra.ph, t.me, bit.ly, tinyurl.com, is.gd, cutt.ly, rb.gy, shorturl.at]


# Scam scoring rules. Edit freely; no code changes needed.
#
# Matching runs on normalised text (NFC, lowercase Latin, ASCII digits, emoji and nukta removed).
# Latin keywords match on word boundaries; Devanagari keywords match as substrings (so stems like
# "ब्लॉक" also catch "ब्लॉक्ड"). Score = sum of fired weights, capped at thresholds.scam.max_score.
# A category fires once: weight + extra_hit_bonus per additional keyword hit (up to max_bonus).
# Thresholds (likely / suspicious) live in thresholds.yaml.

